[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funhtml"
version = "1.0.4"
description = "轻量级 Python HTML 生成库，提供 PyHTML DSL 和 pandas DataFrame 到 HTML 表格转换。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funhtml"
Releases = "https://github.com/farfarfun/funhtml/releases"

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003：docstring 与注释统一用中文，全角标点是有意使用的。
ignore = ["RUF001", "RUF002", "RUF003"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.14.0",
]
